# Netlify Configuration for Satoshi's Vision Archive
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  command = ""

# Security Headers for all pages
#
# v6.0.7 — brought to parity with vercel.json. Until now the Vercel deploy
# (which serves the React bundle, already same-origin-clean) carried a strict
# CSP while THIS deploy — the one publishing the legacy pages that actually
# loaded fonts.bunny.net, p2pool.io and moneroocean.stream — had no CSP at all,
# no HSTS, and a weaker Referrer-Policy. Exactly backwards.
#
# Directive rationale, all verified against the tree rather than assumed:
#   script-src / style-src 'unsafe-inline' — unavoidable and not a regression:
#     every legacy page carries large inline <style>, inline <script>,
#     application/ld+json, and 42 inline onclick handlers. This is the same
#     allowance vercel.json already ships.
#   connect-src 'self' — safe only because the p2pool/moneroocean fetches now
#     go through /api/xmr/mining/pools/live. This block must not land before
#     that change.
#   img-src 'self' data: — no external images anywhere; no blob: needed
#     (zero createObjectURL / new Worker / eval in first-party legacy JS).
#   frame-src https://changenow.io — the one iframe, hold-monero.html:296.
#     Our CSP does not apply inside it; that is a separate browsing context
#     with its own policy.
#   frame-ancestors 'none' is the modern X-Frame-Options: DENY, kept alongside
#     it for older engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src https://changenow.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Cache static assets
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirects
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
