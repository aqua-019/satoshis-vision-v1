name: Auto Approve & Merge PRs

# v6.0.7 — this workflow used to auto-approve and squash-merge every PR into
# main the moment it opened, with nothing gating it. ci.yml did not even
# trigger on main, so PRs into main merged with ZERO checks having run.
#
# The `gate` job below is a partial fix: it makes the merge wait for typecheck,
# build and the static hardening gates. Be clear about its limit — the workflow
# gates itself, so a PR that edits this file removes the gate in the same PR
# that gets auto-merged.
#
# The real fix is repo settings and cannot be done from a PR:
#   1. Branch protection on main, with "v5 CI / typecheck + build" and
#      "v5 CI / hardening gates" as REQUIRED status checks.
#   2. Enable "Allow auto-merge", and change the merge step to
#      `gh pr merge --squash --auto`.
# Both halves or neither: `--auto` is a no-op without required checks — it
# merges immediately if nothing is required.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: app

jobs:
  gate:
    name: gate before merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Static assertions only: no browser, no preview server, ~30s. The full
      # Playwright suite runs in ci.yml; blocking every merge on it would be a
      # poor trade, and these catch the regressions that matter most here
      # (a page losing its paint floor, a third-party origin coming back).
      - name: Static hardening gates
        run: npm run verify:static

  auto-approve-and-merge:
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Auto Approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        run: gh pr merge --squash "$PR_URL"
        working-directory: .
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
