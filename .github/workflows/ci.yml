name: v5 CI

# ── p3·12d · WHY THIS ALSO FIRES ON PUSH TO main ──────────────────────────
#
# Until now this workflow fired on `pull_request` ONLY, which means it had
# never judged `main` — not once. Every "main" figure anyone has quoted was a
# PR-HEAD PROXY: #159's f0fc8179 stood in for 84e2b77 only because the two
# trees happened to be identical, and proving that took a separate manual
# check. For the deterministic gates that substitution is harmless. For the
# wall-clock ones it is the whole problem — verify-vitals' /live/mempool
# ceiling sat unsatisfiable on this runner class for at least three runs, and
# the only reason nobody could tell was that no measurement of main on this
# runner class existed to compare against.
#
# TAKEN: `push: branches: [main]`. A merge now produces main's own numbers on
# the same runner class that judges every PR, so the vitals series has a base
# to difference against instead of a proxy.
#
# THE COST, STATED. On merge, the deterministic half of this workflow —
# typecheck, build, bundle budgets, the twelve offline gates, the static gates
# — re-judges a tree that the PR run already judged, and that IS duplicate
# signal. Roughly 25 runner-minutes per merge, at a handful of merges a week.
# Accepted for two reasons:
#
#   1. The wall-clock half is NOT duplicate. It cannot be, because its subject
#      is partly the machine, and the machine is a different one every run.
#      That is the entire point of adding this.
#   2. `pull_request` CI has never judged a MERGED tree either. It judges the
#      PR's merge-ref, which is only the same as post-merge main while the base
#      has not moved underneath it. Two PRs green in isolation and red together
#      is a state this repo has had no gate against. Now it does, and that is
#      worth the minutes on its own.
#
# NOT TAKEN: a schedule. A cron run would measure main on an arbitrary tree at
# an arbitrary time, which answers "how noisy is the runner" — worth knowing,
# but a different question, and it decouples the measurement from the change
# that caused it. Merge-triggered keeps every baseline attributable to a commit.
#
# Everything structural carries over unchanged: the vitals-last ordering inside
# verify:e2e, `if: always()` on the independent steps, and one step per gate
# rather than an `&&` chain. Nothing below is conditioned on the event, and
# nothing in this file reads `github.event.pull_request`.
on:
  pull_request:
    branches:
      - main
      - v5-migration
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: typecheck + build + offline gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node >=22.18 is required: several verify gates import the shipped .ts
      # sources directly and rely on the runtime's type stripping.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Byte budgets. This step MUST sit after Build and cannot move into
      # `verify:static`: in the `verify` job below, `npm run verify:static` runs
      # BEFORE its own Build step, so a dist-reading gate placed there would
      # fail on every single run. Deterministic — `vite build` emits
      # byte-identical assets for a given tree, and gzip is pinned to level 9
      # inside the gate — so unlike the vitals budgets these ceilings need no
      # per-runner calibration.
      # `continue-on-error` is NOT used, and that is the point: this step still
      # FAILS THE JOB. What changed (v2·3) is that it no longer VETOES the
      # twelve correctness gates below it, which all carry `if: always()`.
      #
      # Measured on #170: a red bundle budget skipped 12 offline gates in this
      # job AND the entire `hardening gates` job — 21 static + 29 e2e — so a
      # 4 KB byte overage silenced 62 gate invocations. A byte budget answers
      # "is this too big"; those gates answer "is this correct". The second
      # question must not become unanswerable because the first said no.
      - name: "Gate: bundle budgets"
        run: npm run verify:bundle

      # Reports, asserts nothing, and is deliberately NOT part of the gate
      # above. "An HTML file was produced" checks nothing about the bundle, so
      # it must never be able to contribute to a pass.
      - name: Bundle report
        if: always()
        run: npm run verify:report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          # Repo-root-relative on purpose: `defaults.run.working-directory`
          # applies to `run:` steps only, never to `uses:` steps.
          path: app/.perf/
          # .perf is a DOTFILE directory and upload-artifact@v4 skips hidden
          # files by default — without this the step logs "No files were found"
          # and succeeds anyway, so the artifact silently never exists. Caught
          # on this PR's own break-test run, where the warning sat in a green
          # step. `error` rather than `warn` for the same reason: a report that
          # quietly stops being produced is worse than no report.
          include-hidden-files: true
          if-no-files-found: error

      # Offline gates only — no browser, no network. The Playwright gates
      # (verify-tiers-dom, verify-glide, verify-allreal-dom, …) need a built
      # preview server and are still run by hand; see app/README.md.
      - name: "Gate: tiered polling contract"
        if: always()
        run: node verify-tiers.mjs

      # Offline, and it belongs here rather than only in verify:static so it can
      # fail before anything is built or served. It owns the one invariant that
      # cannot be expressed in a single place: index.html's pre-paint cold-boot
      # predicate has to answer before the bundle exists, so it is a hand copy of
      # src/coldboot/gate.ts. This evaluates both over a truth table rather than
      # diffing them as text.
      - name: "Gate: cold-boot pre-paint floor + predicate parity"
        if: always()
        run: node verify-cbpending.mjs

      - name: "Gate: node cascade health"
        if: always()
        run: node ../api/_tests/verify-nodehealth.mjs

      - name: "Gate: proxy tx parsing"
        if: always()
        run: node ../api/_tests/verify-tx-parse.mjs

      - name: "Gate: feeds proxy"
        if: always()
        run: node ../api/_tests/verify-feeds.mjs

      # Offline unit gate for the release-ledger pipe (api/_releases-core.js,
      # api/releases.js, api/cron/releases.js). Every upstream and store call is
      # stubbed by replacing globalThis.fetch, and an unstubbed URL THROWS, so
      # "offline" is enforced rather than asserted. The load-bearing half is not
      # data shaping: it is that `rev` and `source` survive on EVERY branch
      # including the failures, because the defect this pipe exists to answer —
      # a production deployment executing code no commit can produce — was
      # invisible for weeks precisely because nothing checked that the answer
      # matched the question. A twin of verify-feeds rather than a section
      # inside it: its subject is three modules that deliberately do NOT import
      # feeds.js, and section 7 asserts the resulting duplication cannot drift.
      - name: "Gate: release ledger pipe"
        if: always()
        run: node ../api/_tests/verify-releases-pipe.mjs

      # Exercises selectMembers/parseDays/cacheSeconds/classifyQuality against
      # the committed api/_fixtures/cg-markets-*.json rows. This is what keeps
      # the Markets groups data-driven: pin-at-index-0, the pegged/derivative
      # exclusions (stablecoins never reach a series slot) and the chart-budget
      # cutoff are all asserted here, offline.
      - name: "Gate: markets aggregator"
        if: always()
        run: node ../api/_tests/verify-markets.mjs

      # Offline: the handler makes zero network calls by design, and the gate
      # proves it with a fetch counter. Its six node-reachability lines are
      # counted as FIXTURED, never as passes — this sandbox and this runner both
      # lack egress to a Monero node, and fixture() exists so that cannot be
      # read as coverage.
      - name: "Gate: status endpoint"
        if: always()
        run: node ../api/_tests/verify-status.mjs

      # Offline, fixture-backed gate for the monero.fail health aggregator.
      # Upstream state transitions (live/degraded/timeout/malformed) are
      # stubbed, proving all four reason codes are producible and mutually
      # distinct. The live node-count assertion is SKIPPED (no egress), not
      # passed — check it on a deploy preview.
      - name: "Gate: monero.fail node population"
        if: always()
        run: node ../api/_tests/verify-nodes.mjs

      # Offline. The two block-header history handlers, which until p3·14b
      # shared nothing but a copy-paste and had no gate at all. Its negative
      # polarity is a COMMITTED FIXTURE (api/_fixtures/xmr-history-prefix.mjs)
      # reproducing the pre-fix handlers verbatim, so every assertion is run
      # against a state that passes it AND one that fails it on every run —
      # there is no mutation anyone has to remember to revert. The load-bearing
      # one iterates the range table and asserts each entry's span against
      # monerod's RESTRICTED_BLOCK_HEADER_RANGE, so a future key cannot
      # silently reintroduce a window no public node will serve.
      - name: "Gate: block-header history windows"
        if: always()
        run: node ../api/_tests/verify-history.mjs

      - name: "Gate: market stale-cache"
        if: always()
        run: node verify-stale.mjs

      - name: "Gate: confirmations"
        if: always()
        run: node verify-confirmations.mjs

      - name: "Gate: tx detail mappers"
        if: always()
        run: node verify-txdetail.mjs

      - name: "Gate: future feed cache"
        if: always()
        run: node verify-feedcache.mjs

  verify:
    # The v6.0.7 hardening gates. Unlike the offline gates in `build` above,
    # these need a real browser and a built preview server, so they get their
    # own job. Only the new gates plus the two they extend run here — several
    # of the remaining verify-*.mjs are marked HISTORICAL (pre-v5.0.14) or
    # expect live upstreams, and wiring those up is a separate audit.
    name: hardening gates
    runs-on: ubuntu-latest
    needs: build
    # `needs: build` is SEQUENCING ONLY — this job runs its own `npm ci`,
    # `verify:static`, Playwright install and `npm run build`, and consumes no
    # artifact from `build`. So a failure over there is not a reason this job
    # cannot answer its own question, and until v2·3 it silently was one: a
    # 4 KB bundle overage on #170 skipped this entire job, all 21 static and 29
    # e2e gates, and CI reported nothing at all about correctness.
    #
    # `!cancelled()` rather than `always()`, and the difference is deliberate:
    # `always()` would spin a fresh runner up for a workflow the operator has
    # just cancelled, and a job cannot be cancelled twice. The steps inside
    # `build` use `always()` because re-running a two-second offline gate after
    # a cancel costs nothing; standing up a browser does.
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Source assertions only — no browser, no build, ~30s.
      - name: Static gates
        run: npm run verify:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # serve-dist, NOT `vite preview`. Preview is an SPA server: it falls back
      # to dist/index.html for every path, which would serve the "/" prerender
      # everywhere and let a broken prerender pass the gates unnoticed.
      # serve-dist mirrors Vercel's order — real file, directory index, then the
      # SPA catch-all. No verify-*.mjs spawns its own server (by design), so CI
      # starts one; wait-preview replaces the `sleep 2` the headers suggest,
      # which races on a cold runner.
      - name: Start static server
        run: node scripts/serve-dist.mjs &

      - name: Wait for preview
        run: npm run wait-preview

      # Drives the built app with the stylesheet blocked, the JS bundle
      # blocked, the lazy chunk dropped, oklch unsupported, and every API
      # response held open for 4s. All routes are intercepted, so no egress.
      #
      # THE NAME LISTS WHAT THE STEP ACTUALLY RUNS. It read "Degraded-mode, Tor
      # and single-origin gates" — three of the 29 gates in `verify:e2e`, at
      # positions 9, 11 and 12 — while memviews, charts, orb, coldboot, govern,
      # cls, vitals and twenty-two others ran underneath it, named by none of
      # them. A label whose subject is narrower than what it covers, in the CI
      # config rather than in an assertion, and it cost real time: someone
      # checking whether the mempool e2e work had run looked for it, did not
      # find it under this name, and WITHDREW A CORRECT CONCLUSION about the
      # `&&` chain as a result. That is worse than the usual direction of this
      # failure, because a retraction looks like rigour.
      # RECOUNTED, never incremented — and it was already stale before p3·15:
      # the title read "(29) … +19" while the chain held 30 members, because
      # p3·14b appended verify-stream without folding it in. p3·15 appended
      # verify-peers (31 / +21); p3·16 inserts verify-superstress (32 / +22);
      # p3·17 adds verify-releases-dom (33) and p3·18 wires verify-legality
      # (34 / +22 — the "+N" holds at 22 because both new gates are NAMED in the
      # title, so the unnamed remainder does not move). p4·01 adds no member and
      # renames none: it MOVES verify-vitals from 33 to 34, so both figures are
      # unchanged and the current title "(34) … +22" is correct. Measured, not
      # derived from the previous title:
      #   node -e "console.log(require('./app/package.json')
      #     .scripts['verify:e2e'].split('&&').length)"
      # THE THREE FIGURES ABOVE THIS PARAGRAPH ARE DATED, NOT CURRENT, and are
      # deliberately left as written: ":97" and ":226" narrate what a 4 KB
      # overage silenced ON #170, and ":277" narrates what the old step name
      # covered WHEN THE MISLABEL WAS FOUND. Each was true when measured. They
      # read as present-tense claims about a 21/29 chain that is now 22/34, so
      # check the figure's date before quoting it — rewriting them would
      # falsify a measurement rather than refresh one.
      #
      # CLOSED 2026-08-17 (p4·01). This paragraph read "KNOWN AND NOT FIXED
      # HERE" from p3·14b until now: verify-stream sat AFTER verify-vitals and
      # was the chain's tail, inverting v6.1.9's reasoning — vitals goes last
      # precisely because it is the most contention-sensitive gate in the suite
      # AND has zero dependents, so its frequently-environmental red should mask
      # nothing. For five releases a vitals red masked verify-stream instead.
      # The tail is now `… verify-orb && verify-stream && verify-vitals`, so
      # vitals is position 34 of 34 and masks nothing again.
      #
      # The move is one line and its risk is not: reordering an && chain changes
      # what masks what for EVERY member, and running verify-stream immediately
      # before a wall-clock gate hands vitals whatever machine state stream
      # leaves behind. Checked rather than assumed — verify-stream starts no
      # server of its own (it drives the shared serve-dist like every other e2e
      # member) and verify-vitals reads no artifact any earlier gate produces,
      # so the two are independent in both directions. verify-vitals was then
      # run TWICE on the reordered chain and its per-route medians recorded in
      # the PR body, so the claim rests on a measurement rather than on this
      # paragraph.
      #
      # p3·16 places verify-superstress at position 15, immediately after
      # verify-peers — MID-CHAIN, deliberately, and not at the tail. (Its first
      # reason was the same expired one recorded in the p3·18 paragraph below:
      # the tail was then carrying the inverted invariant, so appending there
      # deepened a known defect. p4·01 CLOSED that inversion. Corrected here in
      # the same pass, because leaving it would have left this block asserting
      # the inversion is live six lines above the paragraph that records it as
      # closed — one comment block contradicting itself.) The SECOND reason
      # stands unchanged and is sufficient: a gate whose subject is one route
      # has no claim on the position reserved for the gate with zero dependents. Beside verify-peers is also where it belongs by
      # subject: the two share a data source and assert complementary halves
      # of it.
      # p3·18 wires verify-legality at position 17, immediately after
      # verify-releases-dom — MID-CHAIN, for the same two reasons p3·16 placed
      # verify-superstress at 15. (Its first reason was that the tail was then
      # carrying the inverted vitals-last invariant, so appending there deepened
      # a known defect. p4·01 CLOSED that inversion — see above — so only the
      # SECOND reason still stands, and it is sufficient on its own: a gate
      # whose subject is one route has no claim on the position reserved for the
      # gate with zero dependents. Both placements remain correct; one of the
      # two arguments for them has simply expired.)
      #
      # This gate was an ORPHAN from v6.0.10 until now — wired to neither npm
      # nor CI. It was run FIRST against an untouched build before any change
      # was made to it, per v2·3b's rule that you never wire a red gate: it
      # reported 26 passed · 0 failed, exit 0. Nothing needed fixing. Orphans 7 → 6.
      # ── p4·M8 · WHY THE E2E STEP NOW TEES ITS OUTPUT ──────────────────────
      #
      # This chain is 39 members joined by `&&`, so a red anywhere prints its
      # own named assertion and then the step exits 1 — and the ONLY place that
      # named assertion lands is the job log. A job log downloads from Azure
      # blob storage, which the sandbox this repo is developed in answers with
      # `403 to CONNECT`. So the one artifact that says WHICH gate failed is
      # structurally unreadable from the machine that has to fix it, and two
      # rounds of this PR were spent bounding the failure by which POSITION the
      # `&&` chain had reached rather than by reading its name.
      #
      # The channel that IS readable is workflow ANNOTATIONS: `::error::` lines
      # surface through the check-runs API, which the sandbox reaches fine.
      # Confirmed by reading this job's existing two annotations (the Node 20
      # deprecation warning and the bare "Process completed with exit code 1")
      # through that API before writing this.
      #
      # So the run is teed to a file and a follow-up step, on failure only,
      # re-emits the ❌ lines as annotations. It changes NOTHING about what the
      # chain asserts or in what order — `set -o pipefail` is load-bearing so
      # that `tee` cannot swallow the chain's exit code, which is p4·05's
      # recorded trap (a wrapper's status read as the gate's).
      #
      # Bounded at 12 annotations because GitHub caps what it will render and a
      # truncated list that does not say it was truncated is the same defect one
      # level up. The count is printed either way.
      - name: 'E2E gates (39) — memviews · memphone · charts · orb · coldboot · govern · cls · vitals · degraded · Tor · single-origin · releases-dom · legality · mine · site · protocol · explorer · +22'
        run: |
          set -o pipefail
          npm run verify:e2e 2>&1 | tee /tmp/e2e-chain.log

      - name: 'E2E failure — re-emit the named reds as readable annotations'
        if: failure()
        run: |
          LOG=/tmp/e2e-chain.log
          if [ ! -f "$LOG" ]; then
            echo "::error::the e2e chain produced no log at all — it died before its first gate"
            exit 0
          fi
          TOTAL=$(grep -c '❌' "$LOG" || true)
          LAST_OK=$(grep -o '✅ verify-[a-z-]*' "$LOG" | tail -1)
          echo "::error::e2e chain failed · ${TOTAL} red lines · last gate to report GREEN was ${LAST_OK:-none} (so the red is the gate AFTER it)"
          { grep '❌' "$LOG" | head -8; grep '❌' "$LOG" | tail -4; } | while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
          done
          tail -3 "$LOG" | while IFS= read -r line; do
            printf '::error::tail: %s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-400)"
          done

      # ── v2·3b: four gates that existed, asserted real things, and ran in
      # NOTHING. No npm script, no CI step, so nobody had run them in months —
      # and one of them (verify-perf) was RED on main for three reasons, two of
      # which were defects in the gate rather than in the code. That is what an
      # unrun gate decays into.
      #
      # They belong in this job, not `build`: all four need a built dist/ and a
      # live serve-dist, so they sit after "Wait for preview" alongside
      # verify:e2e.
      #
      # ONE STEP PER GATE, never an `&&` chain — a chain lets the first failure
      # hide the other three, which is the veto shape #170 removed one level up.
      # `if: always()` for the same reason: these four answer independent
      # questions and a red one must not make the others unanswerable.
      #
      # THREE, NOT FOUR. `verify:pageshell` is npm-wired but deliberately NOT
      # here, and this is the brief's own rule applied to its own PR: never wire
      # a red gate. It is green locally (369/0) and RED on this runner —
      # `/future@1600: .main no h-scroll (scrollW 1604 vs clientW 1600, over 4)`.
      #
      # That defect is PRE-EXISTING and measured as such, not assumed: reverting
      # this PR's only two src files to 5537976 and rebuilding reproduces it
      # exactly (2px locally, 4px on the runner — it straddles the gate's own
      # TOL of 2). Mechanism: /future's `.v6-proto-grid` lays 4 tracks of
      # 354.5px at 1600, while a `.v6-stagger` child grid sizes its column to
      # the panel's 426.375px min-content and will not shrink, so `.panel`
      # lands at 1601.9 against main's 1600.
      #
      # Fixing it means re-choosing column counts across /future's whole
      # breakpoint ladder — a layout decision on a page this PR does not
      # otherwise touch. Wiring this step is a one-line follow-up once that
      # lands, and `npm run verify:pageshell` proves the fix in the meantime.
      #
      # Counts are stated so a silent drop is visible: a gate that stops
      # reporting its total has stopped being evidence. verify-perf and
      # verify-mobile also emit reasoned SKIPs — the horizontal-overflow metric
      # is provably inert below 769px (html,body overflow-x:clip), so those
      # widths report as not-measured instead of as vacuous passes.
      - name: 'Gate: fit-to-view — reactor · bridge · sediment · constellation (22)'
        if: always()
        run: npm run verify:fit

      - name: 'Gate: mobile 390 + 320 — 12px floor on 18 routes, overflow, tab bar, SVG type, mempool reflow, peers target (59 + 1 skip)'
        if: always()
        run: npm run verify:mobile

      # NOT `verify:perf` — that name now belongs to verify-perf-classic.mjs, a
      # different gate that measures framerate and is deliberately out of CI.
      - name: 'Gate: tier stamp, layer census, background quiescence, timers (22 + 3 skips)'
        if: always()
        run: npm run verify:perf-runtime

      # ── p2·7: the two gates docs/v6-mempool-views-spec.md:148-150 has
      # required since v6.0.3 and which did not exist. Both are registry-driven,
      # so they widen by themselves as the remaining four views land.
      #
      # INDIVIDUAL STEPS, NOT APPENDED TO `verify:e2e`, and the choice is stated
      # rather than assumed because both placements are defensible. The e2e
      # chain is `&&`, so a failure in either of these would make the other
      # unanswerable — and they answer genuinely independent questions ("does
      # the tracked tx survive being mined" vs "do the seven views agree on one
      # feed"). That is the same veto shape the block above removed, so the same
      # remedy applies: one step each, `if: always()`.
      #
      # The cost of the choice, stated: two more browser launches rather than
      # two more navigations inside an existing one. verify-tracking drives a
      # real mempool→block transition per view on the SHIPPED 15s chain tier
      # (its bound is derived, not guessed — see its header), so it is the
      # slower of the two by a wide margin. That is the price of testing the
      # cadence the app actually runs rather than a compressed one.
      #
      # Counts are stated so a silent drop is visible: a gate that stops
      # reporting its total has stopped being evidence.
      - name: 'Gate: tracked tx — mempool→block transition, per-view idiom, depth 0→10, the ?tx= address, all views (184)'
        if: always()
        run: npm run verify:tracking

      - name: 'Gate: MemStatStrip parity — one feed, one set of numbers, all views (80)'
        if: always()
        run: npm run verify:memstats

      # verify-vitals and verify-cls both stamp their measurements, with the
      # harness that produced them, into app/.perf/. Keeping those makes drift
      # readable across runs instead of scrolling away with the log — and it is
      # how the wall-clock ceilings get calibrated against THIS runner rather
      # than against whatever laptop last touched them. `always()` because a
      # failed budget is exactly when the numbers are worth reading.
      - name: Upload measured vitals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-measurements
          path: app/.perf/
          include-hidden-files: true   # .perf is hidden; see the build job's note
          if-no-files-found: error
