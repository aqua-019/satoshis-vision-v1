name: v5 CI

on:
  pull_request:
    branches:
      - main
      - v5-migration
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  verify:
    # The v6.0.7 hardening gates. Only the new ones plus the two they extend
    # run here: several of the other verify-*.mjs are marked HISTORICAL
    # (pre-v5.0.14) or expect live upstreams, and wiring those up is a
    # separate audit rather than something to bundle into this pass.
    name: hardening gates
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Source assertions only — no browser, no build. Fast enough that it is
      # also what gates auto-merge (see auto-merge.yml).
      - name: Static gates
        run: npm run verify:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # No verify-*.mjs spawns its own server (by design — see any "Run:"
      # header); they all assume :4173 is already up. wait-preview replaces
      # the `sleep 2` those headers suggest, which races on a cold runner.
      - name: Start preview
        run: npm run preview &

      - name: Wait for preview
        run: npm run wait-preview

      # Drives the built app with the stylesheet blocked, the JS bundle
      # blocked, the lazy chunk dropped, oklch unsupported, and every API
      # response held open for 4s. All routes are intercepted, so no egress.
      - name: Degraded-mode, Tor and single-origin gates
        run: npm run verify:e2e
