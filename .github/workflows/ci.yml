name: v5 CI

on:
  pull_request:
    branches:
      - main
      - v5-migration

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: typecheck + build + offline gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node >=22.18 is required: several verify gates import the shipped .ts
      # sources directly and rely on the runtime's type stripping.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Byte budgets. This step MUST sit after Build and cannot move into
      # `verify:static`: in the `verify` job below, `npm run verify:static` runs
      # BEFORE its own Build step, so a dist-reading gate placed there would
      # fail on every single run. Deterministic — `vite build` emits
      # byte-identical assets for a given tree, and gzip is pinned to level 9
      # inside the gate — so unlike the vitals budgets these ceilings need no
      # per-runner calibration.
      # `continue-on-error` is NOT used, and that is the point: this step still
      # FAILS THE JOB. What changed (v2·3) is that it no longer VETOES the
      # twelve correctness gates below it, which all carry `if: always()`.
      #
      # Measured on #170: a red bundle budget skipped 12 offline gates in this
      # job AND the entire `hardening gates` job — 21 static + 29 e2e — so a
      # 4 KB byte overage silenced 62 gate invocations. A byte budget answers
      # "is this too big"; those gates answer "is this correct". The second
      # question must not become unanswerable because the first said no.
      - name: "Gate: bundle budgets"
        run: npm run verify:bundle

      # Reports, asserts nothing, and is deliberately NOT part of the gate
      # above. "An HTML file was produced" checks nothing about the bundle, so
      # it must never be able to contribute to a pass.
      - name: Bundle report
        if: always()
        run: npm run verify:report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          # Repo-root-relative on purpose: `defaults.run.working-directory`
          # applies to `run:` steps only, never to `uses:` steps.
          path: app/.perf/
          # .perf is a DOTFILE directory and upload-artifact@v4 skips hidden
          # files by default — without this the step logs "No files were found"
          # and succeeds anyway, so the artifact silently never exists. Caught
          # on this PR's own break-test run, where the warning sat in a green
          # step. `error` rather than `warn` for the same reason: a report that
          # quietly stops being produced is worse than no report.
          include-hidden-files: true
          if-no-files-found: error

      # Offline gates only — no browser, no network. The Playwright gates
      # (verify-tiers-dom, verify-glide, verify-allreal-dom, …) need a built
      # preview server and are still run by hand; see app/README.md.
      - name: "Gate: tiered polling contract"
        if: always()
        run: node verify-tiers.mjs

      # Offline, and it belongs here rather than only in verify:static so it can
      # fail before anything is built or served. It owns the one invariant that
      # cannot be expressed in a single place: index.html's pre-paint cold-boot
      # predicate has to answer before the bundle exists, so it is a hand copy of
      # src/coldboot/gate.ts. This evaluates both over a truth table rather than
      # diffing them as text.
      - name: "Gate: cold-boot pre-paint floor + predicate parity"
        if: always()
        run: node verify-cbpending.mjs

      - name: "Gate: node cascade health"
        if: always()
        run: node ../api/verify-nodehealth.mjs

      - name: "Gate: proxy tx parsing"
        if: always()
        run: node ../api/verify-tx-parse.mjs

      - name: "Gate: feeds proxy"
        if: always()
        run: node ../api/verify-feeds.mjs

      # Exercises selectMembers/parseDays/cacheSeconds/classifyQuality against
      # the committed api/_fixtures/cg-markets-*.json rows. This is what keeps
      # the Markets groups data-driven: pin-at-index-0, the pegged/derivative
      # exclusions (stablecoins never reach a series slot) and the chart-budget
      # cutoff are all asserted here, offline.
      - name: "Gate: markets aggregator"
        if: always()
        run: node ../api/verify-markets.mjs

      # Offline: the handler makes zero network calls by design, and the gate
      # proves it with a fetch counter. Its six node-reachability lines are
      # counted as FIXTURED, never as passes — this sandbox and this runner both
      # lack egress to a Monero node, and fixture() exists so that cannot be
      # read as coverage.
      - name: "Gate: status endpoint"
        if: always()
        run: node ../api/verify-status.mjs

      # Offline, fixture-backed gate for the monero.fail health aggregator.
      # Upstream state transitions (live/degraded/timeout/malformed) are
      # stubbed, proving all four reason codes are producible and mutually
      # distinct. The live node-count assertion is SKIPPED (no egress), not
      # passed — check it on a deploy preview.
      - name: "Gate: monero.fail node population"
        if: always()
        run: node ../api/verify-nodes.mjs

      - name: "Gate: market stale-cache"
        if: always()
        run: node verify-stale.mjs

      - name: "Gate: confirmations"
        if: always()
        run: node verify-confirmations.mjs

      - name: "Gate: tx detail mappers"
        if: always()
        run: node verify-txdetail.mjs

      - name: "Gate: future feed cache"
        if: always()
        run: node verify-feedcache.mjs

  verify:
    # The v6.0.7 hardening gates. Unlike the offline gates in `build` above,
    # these need a real browser and a built preview server, so they get their
    # own job. Only the new gates plus the two they extend run here — several
    # of the remaining verify-*.mjs are marked HISTORICAL (pre-v5.0.14) or
    # expect live upstreams, and wiring those up is a separate audit.
    name: hardening gates
    runs-on: ubuntu-latest
    needs: build
    # `needs: build` is SEQUENCING ONLY — this job runs its own `npm ci`,
    # `verify:static`, Playwright install and `npm run build`, and consumes no
    # artifact from `build`. So a failure over there is not a reason this job
    # cannot answer its own question, and until v2·3 it silently was one: a
    # 4 KB bundle overage on #170 skipped this entire job, all 21 static and 29
    # e2e gates, and CI reported nothing at all about correctness.
    #
    # `!cancelled()` rather than `always()`, and the difference is deliberate:
    # `always()` would spin a fresh runner up for a workflow the operator has
    # just cancelled, and a job cannot be cancelled twice. The steps inside
    # `build` use `always()` because re-running a two-second offline gate after
    # a cancel costs nothing; standing up a browser does.
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Source assertions only — no browser, no build, ~30s.
      - name: Static gates
        run: npm run verify:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # serve-dist, NOT `vite preview`. Preview is an SPA server: it falls back
      # to dist/index.html for every path, which would serve the "/" prerender
      # everywhere and let a broken prerender pass the gates unnoticed.
      # serve-dist mirrors Vercel's order — real file, directory index, then the
      # SPA catch-all. No verify-*.mjs spawns its own server (by design), so CI
      # starts one; wait-preview replaces the `sleep 2` the headers suggest,
      # which races on a cold runner.
      - name: Start static server
        run: node scripts/serve-dist.mjs &

      - name: Wait for preview
        run: npm run wait-preview

      # Drives the built app with the stylesheet blocked, the JS bundle
      # blocked, the lazy chunk dropped, oklch unsupported, and every API
      # response held open for 4s. All routes are intercepted, so no egress.
      #
      # THE NAME LISTS WHAT THE STEP ACTUALLY RUNS. It read "Degraded-mode, Tor
      # and single-origin gates" — three of the 29 gates in `verify:e2e`, at
      # positions 9, 11 and 12 — while memviews, charts, orb, coldboot, govern,
      # cls, vitals and twenty-two others ran underneath it, named by none of
      # them. A label whose subject is narrower than what it covers, in the CI
      # config rather than in an assertion, and it cost real time: someone
      # checking whether the mempool e2e work had run looked for it, did not
      # find it under this name, and WITHDREW A CORRECT CONCLUSION about the
      # `&&` chain as a result. That is worse than the usual direction of this
      # failure, because a retraction looks like rigour.
      - name: 'E2E gates (29) — memviews · charts · orb · coldboot · govern · cls · vitals · degraded · Tor · single-origin · +19'
        run: npm run verify:e2e

      # ── v2·3b: four gates that existed, asserted real things, and ran in
      # NOTHING. No npm script, no CI step, so nobody had run them in months —
      # and one of them (verify-perf) was RED on main for three reasons, two of
      # which were defects in the gate rather than in the code. That is what an
      # unrun gate decays into.
      #
      # They belong in this job, not `build`: all four need a built dist/ and a
      # live serve-dist, so they sit after "Wait for preview" alongside
      # verify:e2e.
      #
      # ONE STEP PER GATE, never an `&&` chain — a chain lets the first failure
      # hide the other three, which is the veto shape #170 removed one level up.
      # `if: always()` for the same reason: these four answer independent
      # questions and a red one must not make the others unanswerable.
      #
      # Counts are stated so a silent drop is visible: a gate that stops
      # reporting its total has stopped being evidence. verify-perf and
      # verify-mobile also emit reasoned SKIPs — the horizontal-overflow metric
      # is provably inert below 769px (html,body overflow-x:clip), so those
      # widths report as not-measured instead of as vacuous passes.
      - name: 'Gate: page shell (369 assertions)'
        if: always()
        run: npm run verify:pageshell

      - name: 'Gate: fit-to-view — reactor · bridge · sediment · constellation (22)'
        if: always()
        run: npm run verify:fit

      - name: 'Gate: mobile 390px — pan, reflow, landing (3 + 1 skip)'
        if: always()
        run: npm run verify:mobile

      # NOT `verify:perf` — that name now belongs to verify-perf-classic.mjs, a
      # different gate that measures framerate and is deliberately out of CI.
      - name: 'Gate: tier stamp, layer census, background quiescence, timers (22 + 3 skips)'
        if: always()
        run: npm run verify:perf-runtime

      # verify-vitals and verify-cls both stamp their measurements, with the
      # harness that produced them, into app/.perf/. Keeping those makes drift
      # readable across runs instead of scrolling away with the log — and it is
      # how the wall-clock ceilings get calibrated against THIS runner rather
      # than against whatever laptop last touched them. `always()` because a
      # failed budget is exactly when the numbers are worth reading.
      - name: Upload measured vitals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitals-measurements
          path: app/.perf/
          include-hidden-files: true   # .perf is hidden; see the build job's note
          if-no-files-found: error
