<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="xmr.irish v5.0 — Monero, in public, in private." />
    <meta name="referrer" content="no-referrer" />
    <title>xmr.irish · v5.0</title>
    <script>
      // Pre-paint theme stamp — avoids a flash of the wrong palette on a
      // hard reload. design/VisualContext.tsx's <VisualProvider> makes this
      // same `documentElement` write once React mounts (and keeps it in
      // sync with in-session changes); this just gets there first, before
      // any bundled CSS paints. CSP note: vercel.json sets
      // `script-src 'self' 'unsafe-inline'`, so this inline script needs no
      // hash or nonce. localStorage throws in some hardened/.onion browser
      // configurations (storage disabled, private mode) — default to
      // indigo on ANY failure, same default VisualContext's safe context
      // value falls back to.
      try {
        var t = localStorage.getItem("xmri.theme");
        document.documentElement.setAttribute("data-theme", t === "classic" ? "classic" : "indigo");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "indigo");
      }
    </script>
  </head>
  <body>
    <noscript>
      <style>
        .nojs{position:fixed;inset:0;overflow:auto;background:#050505;color:#a8a094;box-sizing:border-box;
          font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;line-height:1.6;padding:48px 20px}
        .nojs__wrap{max-width:640px;margin:0 auto}
        .nojs__mark{font-size:22px;letter-spacing:.04em;color:#a8a094}
        /* Indigofera Nocturne (styles-theme.css's [data-theme="indigo"]
           palette), literal — this markup renders before any JS/CSS bundle
           exists, so it can't reach for var(--ui-accent-text) / var(--ui-
           accent-dim); #8B7BF5 / rgb(110,94,240) are those tokens' own
           values, copied in by hand. This is what every hardened/Tor
           browser (and anyone without JS) actually sees. */
        .nojs__mark b{color:#8B7BF5;font-weight:600}
        .nojs__desc{margin:6px 0 28px;font-size:14px;color:#6f6a61}
        .nojs__note{border:1px solid rgba(110,94,240,.28);border-radius:6px;padding:14px 16px;
          font-size:14px;color:#a8a094;margin-bottom:24px;background:rgba(110,94,240,.04)}
        .nojs__facts{list-style:none;padding:0;margin:0 0 24px;font-size:14px;color:#8a8478}
        .nojs__facts li{padding:6px 0;border-top:1px solid rgba(255,255,255,.05)}
        .nojs__a{color:#8B7BF5;text-decoration:none;border-bottom:1px solid rgba(110,94,240,.4)}
      </style>
      <div class="nojs"><div class="nojs__wrap">
        <div class="nojs__mark">xmr<b>.irish</b></div>
        <div class="nojs__desc">Monero education + live mempool, network &amp; market data.</div>
        <div class="nojs__note">This site renders live blockchain data and requires JavaScript.
          Please enable it, or use a JavaScript-capable browser.</div>
        <ul class="nojs__facts">
          <li>Monero is private, untraceable digital cash — amounts, senders and receivers are hidden by default.</li>
          <li>This site is read-only and non-custodial: no funds, no accounts, no wallets, no tracking.</li>
          <li>Nothing here can move money; it only displays public network and market data.</li>
        </ul>
        <a class="nojs__a" href="https://getmonero.org" rel="noopener noreferrer">Learn about Monero → getmonero.org</a>
      </div></div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
